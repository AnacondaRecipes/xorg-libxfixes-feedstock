{% set name = "xorg-libXfixes" %}
{% set version = "6.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ name.split('-')[1] }}-{{ version }}.tar.xz
  sha256: 39f115d72d9c5f8111e4684164d3d68cc1fd21f9b27ff2401b08fddfc0f409ba

build:
  number: 0
  # xorg-libxdmcp, libxcb, libx11, libice aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name|lower) }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - gnuconfig
    - make
    - autoconf
    - automake
    - gettext
    - libtool
  host:
    - pthread-stubs ==0.3
    - xorg-xorgproto {{ xorg_xorgproto }}
    - xorg-libx11 {{ xorg_libx11 }}
    - xorg-util-macros ==1.20.2
  run:
    - {{ pin_compatible('xorg-libx11') }}

test:
  commands:
    - test -f $PREFIX/lib/libXfixes.dylib  # [osx]
    - test -f $PREFIX/lib/libXfixes.so     # [linux]

about:
  home: https://www.x.org/
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxfixes
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxfixes
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: The X.org library for simple protocol fixes.
  description: |
    The X.org library for simple protocol fixes

extra:
  recipe-maintainers:
    - pkgw
